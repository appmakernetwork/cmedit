<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200">
<defs>
<pattern id="p1" width="0.25" height="0.25"><rect width="10" height="10" fill="red"/><circle cx="15" cy="15" r="5" fill="blue"/></pattern>
<pattern id="p2" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(30)"><rect width="10" height="20" fill="green"/></pattern>
<pattern id="p3" width="0.5" height="0.5" patternContentUnits="objectBoundingBox"><rect width="0.25" height="0.25" fill="purple"/></pattern>
<pattern id="p4" patternUnits="userSpaceOnUse" x="5" y="5" width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="orange"/></pattern>
<pattern id="p5" href="#p4" patternTransform="scale(0.5)"/>
</defs>
<rect x="10" y="10" width="80" height="80" fill="url(#p1)" stroke="black"/>
<rect x="110" y="10" width="80" height="80" fill="url(#p2)"/>
<rect x="10" y="110" width="80" height="80" fill="url(#p3)" stroke="black"/>
<circle cx="150" cy="130" r="30" fill="url(#p4)" stroke="black"/>
<rect x="110" y="165" width="80" height="30" fill="url(#p5)" fill-opacity="0.6"/>
</svg>
