<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200">
<defs>
<linearGradient id="l1"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
<linearGradient id="l2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="gold"/><stop offset="50%" stop-color="green" stop-opacity="0.5"/><stop offset="100%" stop-color="black"/></linearGradient>
<linearGradient id="l3" href="#l1" x2="0.3" spreadMethod="reflect"/>
<linearGradient id="l4" xlink:href="#l1" x2="0.3" spreadMethod="repeat"/>
<linearGradient id="l5" gradientUnits="userSpaceOnUse" x1="110" y1="60" x2="190" y2="100"><stop offset="0" stop-color="white"/><stop offset=".5" stop-color="purple"/><stop offset="1" stop-color="white"/></linearGradient>
<linearGradient id="l6" href="#l1" gradientTransform="rotate(45 .5 .5)"/>
<radialGradient id="r1"><stop offset="0" stop-color="yellow"/><stop offset="1" stop-color="red"/></radialGradient>
<radialGradient id="r2" fx="0.25" fy="0.25"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="navy"/></radialGradient>
<radialGradient id="r3" r="0.2" spreadMethod="reflect"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="green"/></radialGradient>
<radialGradient id="r4" r="0.2" spreadMethod="repeat"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="maroon"/></radialGradient>
<radialGradient id="r5" gradientUnits="userSpaceOnUse" cx="150" cy="170" r="30" fx="140" fy="160" fr="5"><stop offset="0" stop-color="cyan"/><stop offset="1" stop-color="black"/></radialGradient>
<radialGradient id="r6"><stop offset="0.3" stop-color="orange"/><stop offset="0.2" stop-color="blue"/><stop offset="0.8" stop-color="green"/></radialGradient>
</defs>
<rect x="10" y="10" width="80" height="40" fill="url(#l1)"/>
<rect x="110" y="10" width="80" height="40" fill="url(#l2)"/>
<rect x="10" y="60" width="40" height="40" fill="url(#l3)"/>
<rect x="55" y="60" width="40" height="40" fill="url(#l4)"/>
<rect x="110" y="60" width="80" height="40" fill="url(#l5)"/>
<circle cx="30" cy="130" r="20" fill="url(#r1)"/>
<circle cx="80" cy="130" r="20" fill="url(#r2)"/>
<rect x="110" y="110" width="35" height="40" fill="url(#r3)"/>
<rect x="155" y="110" width="35" height="40" fill="url(#r4)"/>
<rect x="10" y="160" width="40" height="35" fill="url(#l6)"/>
<rect x="55" y="160" width="40" height="35" fill="none" stroke="url(#l1)" stroke-width="6"/>
<rect x="110" y="160" width="80" height="35" fill="url(#r5)"/>
<rect x="100" y="100" width="8" height="8" fill="url(#r6)" />
</svg>
